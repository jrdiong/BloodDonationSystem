<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donor Appointments</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 20px;
}
h1 {
    text-align: center;
}

/* Appointment Cards */
.appointment-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
.appointment-card {
    background: #fff;
    border-radius: 15px;
    padding: 15px;
    margin: 10px;
    width: 300px;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.2s;
}
.appointment-card:hover {
    transform: translateY(-5px);
}
.appointment-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 12px;
}
.appointment-card h3 {
    margin: 10px 0 5px;
}
.appointment-card p {
    margin: 5px 0;
}
.appointment-card button {
    margin-top: 10px;
    padding: 8px 12px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.appointment-card button:hover {
    background: #c0392b;
}
.greyed { filter: grayscale(100%); opacity:0.6; }

/* Event Details Modal */
.modal {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    width: 400px;
    position: relative;
}
.modal-content img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 15px;
}
.close-modal {
    position: absolute;
    top: 10px;
    right: 15px;
    cursor: pointer;
    font-weight: bold;
}

/* Health Report Modal (optional for booking new events) */
#healthReportModal {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 1001;
}
#healthReportModal .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    width: 400px;
    position: relative;
}
#healthReportModal .modal-content h3 {
    margin-top: 0;
}
#closeHealthModal {
    position: absolute;
    top: 10px;
    right: 15px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>My Appointments</h1>

<div class="appointment-container" id="appointmentContainer">
    <!-- Cards will be injected here -->
</div>

<!-- Event Details Modal -->
<div class="modal" id="appointmentModal">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">X</span>
        <img id="modalImage" src="">
        <h3 id="modalTitle"></h3>
        <p><strong>Date & Time:</strong> <span id="modalDate"></span></p>
        <p><strong>Location:</strong> <span id="modalLocation"></span></p>
        <p><strong>Description:</strong></p>
        <p id="modalDescription"></p>
    </div>
</div>

<!-- Health Report Modal (Optional) -->
<div id="healthReportModal">
    <div class="modal-content">
        <span id="closeHealthModal">X</span>
        <h3>Health Report Form</h3>
        <form id="healthReportForm">
            <label>Medical History:</label><br>
            <textarea name="medicalHistory" required></textarea><br>
            <label>Weight (kg):</label><br>
            <input type="number" name="weight" step="0.1" required><br>
            <label>Height (cm):</label><br>
            <input type="number" name="height" step="0.1" required><br><br>
            <button type="submit">Save & Book</button>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

    const container = document.getElementById('appointmentContainer');
    const modal = document.getElementById('appointmentModal');
    const closeModal = document.getElementById('closeModal');

    const healthModal = document.getElementById('healthReportModal');
    const closeHealthModal = document.getElementById('closeHealthModal');
    const healthForm = document.getElementById('healthReportForm');

    let currentEventID = null;

    // Close modals
    closeModal.addEventListener('click', () => modal.style.display = 'none');
    closeHealthModal.addEventListener('click', () => { healthModal.style.display='none'; healthForm.reset(); });

    // Load appointments
    async function loadAppointments() {
        try {
            const res = await fetch('donor_appointments.php');
            const data = await res.json();
            if(data.status !== 'success') { alert(data.message || 'Failed'); return; }

            container.innerHTML = '';

            data.appointments.forEach(app => {
                const card = document.createElement('div');
                card.classList.add('appointment-card');
                if(['completed','cancelled','rejected'].includes(app.status)){
                    card.classList.add('greyed');
                }

                const img = document.createElement('img');
                img.src = app.image_url || 'placeholder.jpg';
                card.appendChild(img);

                const title = document.createElement('h3');
                title.textContent = app.eventName;
                card.appendChild(title);

                const date = document.createElement('p');
                date.textContent = 'Date: ' + app.eventDateTime;
                card.appendChild(date);

                const location = document.createElement('p');
                location.textContent = 'Location: ' + (app.location || 'TBD');
                card.appendChild(location);

                const count = document.createElement('p');
                count.textContent = `Booking: ${app.currentBookings}/${app.maxDonors}`;
                card.appendChild(count);

                const status = document.createElement('p');
                status.textContent = 'Status: ' + app.status;
                card.appendChild(status);

                // Cancel button for pending
                if(app.status === 'pending'){
                    const btn = document.createElement('button');
                    btn.textContent = 'Cancel Appointment';
                    btn.addEventListener('click', function(e){
                        e.stopPropagation();
                        cancelAppointment(app.appointmentID);
                    });
                    card.appendChild(btn);
                }

                // Click card to show event details
                card.addEventListener('click', function(){
                    openModal(app);
                });

                container.appendChild(card);
            });
        } catch(err) {
            console.error(err);
            alert('Error loading appointments');
        }
    }

    function openModal(app) {
        document.getElementById('modalImage').src = app.image_url || 'placeholder.jpg';
        document.getElementById('modalTitle').innerText = app.eventName;
        document.getElementById('modalDate').innerText = app.eventDateTime;
        document.getElementById('modalLocation').innerText = app.location || 'TBD';
        document.getElementById('modalDescription').innerText = app.description || 'No description';
        modal.style.display = 'flex';
    }

    async function cancelAppointment(appointmentID){
        if(!confirm('Cancel this appointment?')) return;
        const form = new FormData();
        form.append('action','cancelAppointment');
        form.append('appointmentID', appointmentID);
        try{
            const res = await fetch('donor_appointments.php', { method:'POST', body: form });
            const data = await res.json();
            if(data.status === 'success'){
                alert('Appointment cancelled successfully');
                loadAppointments();
            } else {
                alert(data.message || 'Failed');
            }
        } catch(err) {
            console.error(err);
            alert('Failed to cancel appointment');
        }
    }

    loadAppointments();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Request Manage</title>

<style>
body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }

/* Request Button */
#requestBtn {
    position: relative;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
#requestBadge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: #fff;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 12px;
}

/* Modal */
#requestModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
#modalContent {
    background: #fff;
    width: 600px;
    border-radius: 15px;
    padding: 20px;
    position: relative;
}
#modalContent img {
    width: 150px;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
}
#closeModal {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 18px;
    cursor: pointer;
}
#modalButtons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}
#eventDescription {
    max-height: 100px;
    overflow-y: auto;
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f9f9f9;
    white-space: pre-wrap;
    margin-bottom: 10px;
}

/* Recorded Table */
#recordedTable {
    width: 100%;
    border-collapse: collapse;
    margin-top: 30px;
}
#recordedTable th, #recordedTable td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}
#recordedTable th {
    background: #eee;
}
#recordedTable img {
    width: 100px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
}

#loading {
    display: none;
    margin-top: 10px;
    color: green;
}
</style>
</head>

<body>

<h2>Admin Request Manage</h2>

<!-- Request Button -->
<button id="requestBtn">
    Requests <span id="requestBadge">0</span>
</button>
<div id="loading">Loading...</div>

<!-- Modal -->
<div id="requestModal">
    <div id="modalContent">
        <span id="closeModal">&#10005;</span>

        <h3>Event Request</h3>

        <img id="eventImage" src="placeholder.jpg">
        <p><strong>Name:</strong> <span id="eventName"></span></p>
        <p><strong>Date/Time:</strong> <span id="eventDateTime"></span></p>
        <p><strong>Location:</strong> <span id="eventLocation"></span></p>
        <p><strong>Organizer:</strong> <span id="eventOrganizer"></span></p>

        <p><strong>Description:</strong></p>
        <div id="eventDescription"></div>

        <div id="modalButtons">
            <button id="approveBtn">Approve</button>
            <button id="rejectBtn">Reject</button>
        </div>
    </div>
</div>

<!-- Recorded -->
<h3>Recorded Requests</h3>
<table id="recordedTable">
    <thead>
        <tr>
            <th>Event Image</th>
            <th>Event Name</th>
            <th>Date / Time</th>
            <th>Location</th>
            <th>Record Status</th>
        </tr>
    </thead>
    <tbody id="recordedBody"></tbody>
</table>

<script>
let pendingRequests = [];
let currentIndex = 0;

const requestBadge = document.getElementById('requestBadge');
const requestBtn = document.getElementById('requestBtn');
const requestModal = document.getElementById('requestModal');
const closeModal = document.getElementById('closeModal');

const eventImage = document.getElementById('eventImage');
const eventName = document.getElementById('eventName');
const eventDateTime = document.getElementById('eventDateTime');
const eventLocation = document.getElementById('eventLocation');
const eventOrganizer = document.getElementById('eventOrganizer');
const eventDescription = document.getElementById('eventDescription');

const approveBtn = document.getElementById('approveBtn');
const rejectBtn = document.getElementById('rejectBtn');
const recordedBody = document.getElementById('recordedBody');
const loading = document.getElementById('loading');

/* ================= Pending ================= */
async function loadPending() {
    try {
        const res = await fetch('request_manage.php?action=pending');
        const data = await res.json();
        if (data.status === 'success') {
            pendingRequests = data.pending || [];
            requestBadge.textContent = pendingRequests.length; // 永远显示 badge，即使 0
        } else {
            console.error('Failed to load pending:', data.message);
        }
    } catch (e) {
        console.error('Failed to load pending requests', e);
    }
}

/* ================= Recorded ================= */
async function loadRecorded() {
    try {
        const res = await fetch('request_manage.php?action=recorded');
        const data = await res.json();
        if (data.status === 'success') {
            recordedBody.innerHTML = '';
            data.recorded.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${r.image_url || 'placeholder.jpg'}"></td>
                    <td>${r.eventName}</td>
                    <td>${r.dateTime}</td>
                    <td>${r.location || ''}</td>
                    <td>${r.requestStatus == 1 ? 'Recorded' : r.requestStatus == 0 ? 'Not Recorded' : 'Rejected'}</td>
                `;
                recordedBody.appendChild(tr);
            });
        }
    } catch (e) {
        console.error('Failed to load recorded requests', e);
    }
}

/* ================= Modal ================= */
function showCurrent() {
    if (currentIndex >= pendingRequests.length) {
        requestModal.style.display = 'none';
        currentIndex = 0;
        loadPending();
        loadRecorded();
        return;
    }

    const r = pendingRequests[currentIndex];
    if (!r) return; // 防止 undefined

    eventImage.src = r.image_url || 'placeholder.jpg';
    eventName.textContent = r.eventName;
    eventDateTime.textContent = r.dateTime;
    eventLocation.textContent = r.location || '';
    eventOrganizer.textContent = r.organizerName;
    eventDescription.textContent = r.description || '';

    requestModal.style.display = 'flex';
}

/* ================= Buttons ================= */
requestBtn.onclick = () => {
    loadPending().then(() => {
        if (pendingRequests.length === 0) {
            alert('No pending requests');
            return;
        }
        showCurrent();
    });
};

closeModal.onclick = () => requestModal.style.display = 'none';

async function handleAction(action) {
    if (!pendingRequests[currentIndex]) {
        alert('No pending request selected');
        return;
    }

    const r = pendingRequests[currentIndex];
    const fd = new FormData();
    fd.append('action', action);
    fd.append('requestID', r.requestID);
    fd.append('eventID', r.eventID);

    if (action === 'approve') {
        const record = confirm('Record this event?');
        fd.append('record', record ? 1 : 0);
    }

    try {
        const res = await fetch('request_manage.php', { method:'POST', body: fd });
        const data = await res.json();
        if (data.status === 'success') {
            currentIndex++;
            showCurrent();
            loadPending();   // 处理完自动刷新 badge
            loadRecorded();  // 自动刷新 recorded table
        } else {
            alert(data.message || 'Action failed');
            loadPending();
            loadRecorded();
        }
    } catch(e) {
        console.error(e);
        alert('Action failed');
    }
}

approveBtn.onclick = () => handleAction('approve');
rejectBtn.onclick = () => handleAction('reject');

/* ================= Init ================= */
window.onload = () => {
    loadPending();
    loadRecorded();

    // 每 10 秒自动刷新 pending badge
    setInterval(loadPending, 10000);
};
</script>

</body>
</html>

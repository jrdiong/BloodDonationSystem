<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Request Manage</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }

/* Request Button */
#requestBtn {
    position: relative;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
#requestBadge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: #fff;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 12px;
}

/* Modal */
#requestModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
#modalContent {
    background: #fff;
    width: 600px;
    border-radius: 15px;
    padding: 20px;
    position: relative;
}
#modalContent img {
    width: 150px;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
}
#closeModal {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 18px;
    cursor: pointer;
}
#modalButtons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

/* Recorded Requests Table */
#recordedTable {
    width: 100%;
    border-collapse: collapse;
    margin-top: 30px;
}
#recordedTable th, #recordedTable td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}
#recordedTable th {
    background: #eee;
}
#recordedTable img {
    width: 100px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
}
</style>
</head>
<body>

<h2>Admin Request Manage</h2>

<!-- Request Button -->
<button id="requestBtn">Requests <span id="requestBadge">0</span></button>

<!-- Modal for Pending Request -->
<div id="requestModal">
    <div id="modalContent">
        <span id="closeModal">&#10005;</span>
        <h3 id="modalTitle">Event Request</h3>
        <img id="eventImage" src="placeholder.jpg" alt="Event Image">
        <p><strong>Name:</strong> <span id="eventName"></span></p>
        <p><strong>Date/Time:</strong> <span id="eventDateTime"></span></p>
        <p><strong>Location:</strong> <span id="eventLocation"></span></p>
        <p><strong>Organizer:</strong> <span id="eventOrganizer"></span></p>
        <div id="modalButtons">
            <button id="approveBtn">Approve</button>
            <button id="rejectBtn">Reject</button>
        </div>
    </div>
</div>

<!-- Recorded Requests Table -->
<h3>Recorded Requests</h3>
<table id="recordedTable">
    <thead>
        <tr>
            <th>Event Image</th>
            <th>Event Name</th>
            <th>Date/Time</th>
            <th>Location</th>
            <th>Record Status</th>
        </tr>
    </thead>
    <tbody id="recordedBody">
        <!-- Filled dynamically -->
    </tbody>
</table>

<script>
let pendingRequests = [];
let currentRequestIndex = 0;

// Elements
const requestBtn = document.getElementById('requestBtn');
const requestBadge = document.getElementById('requestBadge');
const requestModal = document.getElementById('requestModal');
const closeModal = document.getElementById('closeModal');
const eventImage = document.getElementById('eventImage');
const eventName = document.getElementById('eventName');
const eventDateTime = document.getElementById('eventDateTime');
const eventLocation = document.getElementById('eventLocation');
const eventOrganizer = document.getElementById('eventOrganizer');
const approveBtn = document.getElementById('approveBtn');
const rejectBtn = document.getElementById('rejectBtn');
const recordedBody = document.getElementById('recordedBody');

// ================== Fetch Pending Requests ==================
async function loadPendingRequests() {
    try {
        const res = await fetch('request_manage.php?action=pending');
        const data = await res.json();
        if(data.status!=='success') { alert(data.message||'Failed to load requests'); return; }

        pendingRequests = data.pending || [];
        requestBadge.textContent = pendingRequests.length;
    } catch(e) { console.error(e); alert('Failed to load requests'); }
}

// ================== Fetch Recorded Requests ==================
async function loadRecordedRequests() {
    try {
        const res = await fetch('request_manage.php?action=recorded');
        const data = await res.json();
        if(data.status!=='success') { alert(data.message||'Failed to load recorded requests'); return; }

        recordedBody.innerHTML = '';
        data.recorded.forEach(r=>{
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${r.image_url||'placeholder.jpg'}"></td>
                <td>${r.eventName}</td>
                <td>${r.dateTime}</td>
                <td>${r.location}</td>
                <td>${r.recordStatus==1?'Recorded':'Not Recorded'}</td>
            `;
            recordedBody.appendChild(tr);
        });
    } catch(e){ console.error(e); alert('Failed to load recorded requests'); }
}

// ================== Show Next Pending Request ==================
function showNextRequest() {
    if(currentRequestIndex >= pendingRequests.length) {
        requestModal.style.display='none';
        currentRequestIndex=0;
        loadPendingRequests(); // refresh badge
        loadRecordedRequests(); // refresh table
        return;
    }

    const req = pendingRequests[currentRequestIndex];
    eventImage.src = req.image_url || 'placeholder.jpg';
    eventName.textContent = req.eventName;
    eventDateTime.textContent = req.dateTime;
    eventLocation.textContent = req.location;
    eventOrganizer.textContent = req.organizerName;

    requestModal.style.display='flex';
}

// ================== Button Clicks ==================
requestBtn.onclick = () => {
    if(pendingRequests.length>0) {
        showNextRequest();
    } else {
        alert('No pending requests');
    }
};

closeModal.onclick = () => requestModal.style.display='none';

approveBtn.onclick = async () => {
    const record = confirm('Do you want to record this request? Click OK for Yes, Cancel for No');
    const req = pendingRequests[currentRequestIndex];
    try{
        const formData = new FormData();
        formData.append('action','approve');
        formData.append('eventID', req.eventID);
        formData.append('record', record?1:0);

        const res = await fetch('request_manage.php', {method:'POST', body:formData});
        const data = await res.json();
        if(data.status==='success'){
            currentRequestIndex++;
            showNextRequest();
        } else { alert(data.message||'Approve failed'); }
    }catch(e){ console.error(e); alert('Approve failed'); }
};

rejectBtn.onclick = async () => {
    const req = pendingRequests[currentRequestIndex];
    try{
        const formData = new FormData();
        formData.append('action','reject');
        formData.append('eventID', req.eventID);

        const res = await fetch('request_manage.php', {method:'POST', body:formData});
        const data = await res.json();
        if(data.status==='success'){
            currentRequestIndex++;
            showNextRequest();
        } else { alert(data.message||'Reject failed'); }
    }catch(e){ console.error(e); alert('Reject failed'); }
};

// ================== Initialize ==================
window.addEventListener('DOMContentLoaded', () => {
    loadPendingRequests();
    loadRecordedRequests();
});
</script>
</body>
</html>

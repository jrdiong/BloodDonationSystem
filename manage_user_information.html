<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New User</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; }
        input { padding: 8px; width: 100%; margin-bottom: 10px; }
        select { padding: 8px; width: 100%; margin-bottom: 10px; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
        .message { margin-top: 15px; padding: 10px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Create New User</h2>

<form id="createUserForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phoneNumber">Phone Number</label>
    <input type="text" id="phoneNumber" name="phoneNumber" required>

    <label for="role">Role</label>
    <select id="role" name="role" required>
        <option value="" disabled selected hidden>Choose a role</option>
        <option value="Hospital">Hospital</option>
        <option value="Event Organizer">Event Organizer</option>
    </select>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <div id="locationField" style="display:none;">
        <label for="location">Location (Hospital only)</label>
        <input type="text" id="location" name="location">
    </div>

    <button type="submit">Create User</button>
</form>

<div id="responseMessage" class="message" style="display: none;"></div>

<h2>Existing Users</h2>

<!-- Hospital Users Table -->
<h3>Hospital Users</h3>
<table id="hospital-table">
    <thead>
        <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Location</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- Event Organizer Users Table -->
<h3>Event Organizer Users</h3>
<table id="event-organizer-table">
    <thead>
        <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone Number</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    // Show/hide the Location field based on the selected role
    document.getElementById('role').addEventListener('change', function () {
        var role = this.value;
        var locationField = document.getElementById('locationField');
        var locationInput = document.getElementById('location');

        if (role === 'Hospital') {
            locationField.style.display = 'block';
            locationInput.required = true;   // Location is required for Hospital
        } else {
            locationField.style.display = 'none';
            locationInput.required = false;
            locationInput.value = '';       // Clear Location if not Hospital
        }
    });

    // Handle form submission
    document.getElementById('createUserForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var formData = new FormData(this); // Use FormData to include all form fields

        // Optional: Debug - log all form data to console
        for (var pair of formData.entries()) {
            console.log(pair[0] + ': ' + pair[1]);
        }

        fetch('manage_user_information.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            var messageElement = document.getElementById('responseMessage');

            if (data.status === 'success') {
                messageElement.classList.add('success');
                messageElement.classList.remove('error');
                messageElement.textContent = data.message;

                // Reset the form and hide the Location field
                this.reset();
                document.getElementById('locationField').style.display = 'none';

                // Automatically reload the user tables
                loadUsers();

            } else {
                messageElement.classList.add('error');
                messageElement.classList.remove('success');
                messageElement.textContent = data.message;
            }

            messageElement.style.display = 'block';
        })
        .catch(error => {
            var messageElement = document.getElementById('responseMessage');
            messageElement.classList.add('error');
            messageElement.classList.remove('success');
            messageElement.textContent = 'Error: ' + error.message;
            messageElement.style.display = 'block';
        });
    });

    // Function to load users and render the tables
    function loadUsers() {
        fetch('manage_user_information.php')
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    // Clear the existing table rows
                    document.querySelector('#hospital-table tbody').innerHTML = '';
                    document.querySelector('#event-organizer-table tbody').innerHTML = '';

                    // Render Hospital users
                    data.hospitals.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.userID}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.phoneNumber}</td>
                            <td>${user.location ?? ''}</td>
                        `;
                        document.querySelector('#hospital-table tbody').appendChild(row);
                    });

                    // Render Event Organizer users
                    data.event_organizers.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.userID}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.phoneNumber}</td>
                        `;
                        document.querySelector('#event-organizer-table tbody').appendChild(row);
                    });
                }
            })
            .catch(error => console.error('Error fetching users:', error));
    }

    // Load users when the page first loads
    loadUsers();
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New User</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; }
        input { padding: 8px; width: 100%; margin-bottom: 10px; }
        select { padding: 8px; width: 100%; margin-bottom: 10px; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
        .message { margin-top: 15px; padding: 10px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Create New User</h2>

<form id="createUserForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phoneNumber">Phone Number</label>
    <input type="text" id="phoneNumber" name="phoneNumber" required>

    <label for="role">Role</label>
    <select id="role" name="role" required>
        <option value="Hospital">Hospital</option>
        <option value="Event Organizer">Event Organizer</option>
    </select>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <div id="locationField" style="display:none;">
        <label for="location">Location (Hospital only)</label>
        <input type="text" id="location" name="location">
    </div>

    <button type="submit">Create User</button>
</form>

<div id="responseMessage" class="message" style="display: none;"></div>

<h2>Existing Users</h2>

<!-- Hospital Users Table -->
<h3>Hospital Users</h3>
<table id="hospital-table">
    <thead>
        <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone Number</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- Event Organizer Users Table -->
<h3>Event Organizer Users</h3>
<table id="event-organizer-table">
    <thead>
        <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone Number</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    // Dynamically show/hide Location field based on role selection
    document.getElementById('role').addEventListener('change', function () {
        var role = this.value;
        var locationField = document.getElementById('locationField');
        if (role === 'Hospital') {
            locationField.style.display = 'block';
        } else {
            locationField.style.display = 'none';
        }
    });

    // Handle form submission
    document.getElementById('createUserForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var formData = new FormData(this);  // Using FormData

        // Debug: Log form data to check if 'role' is being sent
        for (var pair of formData.entries()) {
            console.log(pair[0] + ': ' + pair[1]);  // This will show all the form data
        }

        fetch('manage_user_information.php', {
            method: 'POST',
            body: formData,  // Directly sending FormData
        })
        .then(response => response.json())
        .then(data => {
            var messageElement = document.getElementById('responseMessage');
            if (data.status === 'success') {
                messageElement.classList.add('success');
                messageElement.classList.remove('error');
                messageElement.textContent = data.message;
            } else {
                messageElement.classList.add('error');
                messageElement.classList.remove('success');
                messageElement.textContent = data.message;
            }
            messageElement.style.display = 'block';
        })
        .catch(error => {
            var messageElement = document.getElementById('responseMessage');
            messageElement.classList.add('error');
            messageElement.classList.remove('success');
            messageElement.textContent = 'Error: ' + error.message;
            messageElement.style.display = 'block';
        });
    });

    // Fetch user data from PHP API (fetch hospital and event organizer users)
    fetch('manage_user_information.php')
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                // Populate Hospital users
                const hospitalTableBody = document.querySelector('#hospital-table tbody');
                data.hospitals.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.userID}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.phoneNumber}</td>
                    `;
                    hospitalTableBody.appendChild(row);
                });

                // Populate Event Organizer users
                const eventOrganizerTableBody = document.querySelector('#event-organizer-table tbody');
                data.event_organizers.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.userID}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.phoneNumber}</td>
                    `;
                    eventOrganizerTableBody.appendChild(row);
                });
            } else {
                console.error('Error:', data.message);
            }
        })
        .catch(error => console.error('Error fetching data:', error));
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>
    <style>
        /* Basic styling for the layout */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f8f8;
        }
        
        /* Sidebar */
        .nav {
            width: 250px;
            background-color: #333;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 10px 0;
            margin: 10px 0;
            text-align: center;
            background-color: #444;
            border-radius: 5px;
        }

        .nav a:hover {
            background-color: #555;
        }

        .nav a.active {
            background-color: #e74c3c;
        }

        /* Main content area */
        .content {
            flex: 1;
            padding: 20px;
            background-color: white;
        }

        .header {
            background-color: #f8d7da;
            padding: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
        }

        /* Event list */
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .event-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .event-item span {
            margin-right: 10px;
        }

        .event-status {
            width: 80px;
            height: 20px;
            border-radius: 5px;
        }

        .status-green {
            background-color: green;
            color: white;
        }

        .status-red {
            background-color: red;
            color: white;
        }

        .status-yellow {
            background-color: yellow;
            color: black;
        }

        /* Event Edit Form */
        .event-form {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 500px;
            z-index: 100;
            border-radius: 5px;
        }

        .event-form input, .event-form select, .event-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .event-form button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .event-form button:hover {
            background-color: #2980b9;
        }

        .close-form {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            color: #3498db;
            font-size: 20px;
        }

    </style>
</head>
<body>

    <!-- Sidebar (Nav) -->
    <div class="nav">
        <a href="#" class="active">Event</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Header Section -->
        <div class="header">
            <h1>Events</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        </div>

        <!-- Event List -->
        <div class="event-list" id="eventList">
            <!-- Event items will be dynamically inserted here -->
        </div>

        <!-- Event Edit Form -->
        <div class="event-form" id="eventForm">
            <span class="close-form" onclick="closeForm()">×</span>
            <h2>Edit Event</h2>
            <form id="editEventForm">
                <input type="text" id="eventName" placeholder="Event Name" required>
                <textarea id="eventDescription" placeholder="Description" required></textarea>
                <input type="datetime-local" id="eventDateTime" required>
                <input type="text" id="eventLocation" placeholder="Location" required>
                <input type="number" id="eventMaxDonors" placeholder="Max Donors" required>
                <select id="eventHospital" required>
                    <!-- Hospital options will be inserted dynamically -->
                </select>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        // Simulate a logged-in user
        const role = 'Event Organizer'; // This should come from the session or backend
        const userID = 1; // Also comes from the session or backend

        // Dummy data for events (replace with data from the backend)
        const events = [
            { id: 1, name: 'Blood Donation Event 1', hospital: 'City Hospital', status: 1, organizerID: 1 },
            { id: 2, name: 'Health Awareness Campaign', hospital: 'General Hospital', status: 0, organizerID: 1 },
            { id: 3, name: 'Blood Donation Event 2', hospital: 'City Hospital', status: 1, organizerID: 1 },
        ];

        // Fetch hospitals (this should be replaced with an actual API call to fetch hospitals)
        const hospitals = [
            { id: 1, name: 'City Hospital' },
            { id: 2, name: 'General Hospital' },
        ];

        // Function to load events and display them
        function loadEvents() {
            const eventListContainer = document.getElementById('eventList');
            eventListContainer.innerHTML = '';

            events.forEach(event => {
                if (role === 'Event Organizer' || role === 'Hospital') {
                    if (event.organizerID === userID || event.hospital === 'City Hospital') {
                        const eventDiv = document.createElement('div');
                        eventDiv.classList.add('event-item');
                        eventDiv.innerHTML = `
                            <span>${event.name}</span>
                            <span class="event-status ${event.status === 1 ? 'status-green' : 'status-red'}">${event.status === 1 ? 'Active' : 'Deleted'}</span>
                            <button onclick="editEvent(${event.id})">Edit</button>
                        `;
                        eventListContainer.appendChild(eventDiv);
                    }
                }
            });
        }

        // Function to show the event edit form
        function editEvent(eventID) {
            const event = events.find(e => e.id === eventID);
            document.getElementById('eventName').value = event.name;
            document.getElementById('eventDescription').value = event.description;
            document.getElementById('eventDateTime').value = event.dateTime;
            document.getElementById('eventLocation').value = event.location;
            document.getElementById('eventMaxDonors').value = event.maxDonors;

            // Populate the hospital select dropdown
            const hospitalSelect = document.getElementById('eventHospital');
            hospitalSelect.innerHTML = '';
            hospitals.forEach(hospital => {
                const option = document.createElement('option');
                option.value = hospital.id;
                option.textContent = hospital.name;
                hospitalSelect.appendChild(option);
            });

            // Show the form
            document.getElementById('eventForm').style.display = 'block';
        }

        // Function to close the form
        function closeForm() {
            document.getElementById('eventForm').style.display = 'none';
        }

        // Load events on page load
        loadEvents();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 20px;
        }

        h1 {
            color: #ff4d4d;
            font-size: 36px;
            text-align: left;
            margin: 0;
            padding: 10px 0;
        }

        .header-info {
            background-color: #ffe6e6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header-info h2 {
            margin: 0;
            font-size: 24px;
        }

        .header-info p {
            font-size: 16px;
            color: #555;
        }

        .table-layout {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .table-cell {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
        }

        .create-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .create-button:hover {
            background-color: #218838;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .modal-content label {
            display: block;
            margin-bottom: 8px;
        }

        .modal-content input, .modal-content textarea, .modal-content button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .modal-content button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        .modal-content button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-info">
        <h2>Event List</h2>
        <p>Below is the list of all upcoming blood donation events. You can also create a new event by clicking the "Create New Event" button.</p>
    </div>

    <!-- Table-like layout for event data -->
    <div id="eventList" class="table-layout">
        <!-- Event list will be dynamically populated here -->
    </div>

    <button class="create-button" onclick="openCreateForm()">Create New Event</button>
</div>

<!-- Modal for creating a new event -->
<div id="createEventModal" class="modal">
    <div class="modal-content">
        <h2>Create New Event</h2>
        <form id="createEventForm" enctype="multipart/form-data">
            <label for="eventName">Event Name:</label>
            <input type="text" id="eventName" name="eventName" required>
            
            <label for="imageUpload">Upload Event Image:</label>
            <input type="file" id="imageUpload" name="imageUpload" accept="image/*" required>
            
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required>
            
            <label for="dateTime">Date & Time:</label>
            <input type="datetime-local" id="dateTime" name="dateTime" required>
            
            <label for="maxDonors">Max Donors:</label>
            <input type="number" id="maxDonors" name="maxDonors" required>
            
            <label for="description">Description (Optional):</label>
            <textarea id="description" name="description"></textarea>

            <button type="button" onclick="saveEvent()">Save</button>
            <button type="button" onclick="cancelCreate()">Cancel</button>
        </form>
    </div>
</div>

<script>
    function fetchEvents() {
        fetch('event.php')
            .then(response => response.json())
            .then(events => {
                displayEvents(events);
            })
            .catch(error => console.error('Error fetching events:', error));
    }

    function displayEvents(events) {
        const eventList = document.getElementById('eventList');
        eventList.innerHTML = '';

        events.forEach(event => {
            const eventItem = document.createElement('div');
            eventItem.className = 'table-layout';
            eventItem.innerHTML = `
                <div class="table-cell">${event.eventName}</div>
                <div class="table-cell"><img src="${event.image_url}" alt="Event Image" width="50"></div>
                <div class="table-cell">${event.eventName}</div>
                <div class="table-cell">${event.dateTime}</div>
                <div class="table-cell">${event.maxDonors}</div>
            `;
            eventList.appendChild(eventItem);
        });
    }

    function openCreateForm() {
        document.getElementById('createEventModal').style.display = 'flex';
    }

    function cancelCreate() {
        document.getElementById('createEventModal').style.display = 'none';
    }

    function saveEvent() {
        const formData = new FormData(document.getElementById('createEventForm'));

        fetch('event.php', {
            method: 'POST',
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                alert('Event created successfully!');
                fetchEvents();  // Refresh the event list
                cancelCreate(); // Close the form
            } else {
                alert('Failed to create event.');
            }
        })
        .catch(error => {
            console.error('Error saving event:', error);
            alert('An error occurred while saving the event.');
        });
    }

    fetchEvents();
</script>

</body>
</html>

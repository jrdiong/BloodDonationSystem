<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Creation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 60px;
            background-color: #2a3d5f;
            padding-top: 50px;
            text-align: center;
        }

        .sidebar button {
            display: block;
            background-color: #555;
            border: none;
            width: 40px;
            height: 40px;
            margin: 10px 0;
            color: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .sidebar button:hover {
            background-color: #777;
        }

        /* Main Content */
        .main-content {
            width: 80%;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: red;
            margin-bottom: 10px;
        }

        .heading {
            background-color: #f9d8d8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .form-group button {
            padding: 10px 20px;
            background-color: #FF8C00;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #e07b00;
        }

        /* Status Bar */
        .status-bar {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .status-bar .status {
            height: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .status-bar .status.green {
            background-color: green;
        }

        .status-bar .status.red {
            background-color: red;
        }

        .status-bar .status.gray {
            background-color: gray;
        }

        /* Alert Icon */
        .alert-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: red;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="alert-icon">
                !
            </div>
            <h1>Event</h1>

            <div class="heading">
                <h2>Heading</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
            </div>

            <form id="eventForm">
                <!-- Event Name -->
                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" name="eventName" required>
                </div>

                <!-- Event Image URL -->
                <div class="form-group">
                    <label for="image_url">Image URL</label>
                    <input type="text" id="image_url" name="image_url" required>
                </div>

                <!-- Location -->
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" required>
                </div>

                <!-- Date and Time -->
                <div class="form-group">
                    <label for="dateTime">Date & Time</label>
                    <input type="datetime-local" id="dateTime" name="dateTime" required>
                </div>

                <!-- Max Donors -->
                <div class="form-group">
                    <label for="maxDonors">Max Donors</label>
                    <input type="number" id="maxDonors" name="maxDonors" required>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" required></textarea>
                </div>

                <!-- Submit Button -->
                <div class="form-group">
                    <button type="submit">Create Event</button>
                </div>
            </form>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status green"></div>
                <div class="status gray"></div>
                <div class="status green"></div>
                <div class="status red"></div>
                <div class="status green"></div>
                <div class="status green"></div>
            </div>
        </div>
    </div>

    <script>
        // Form submission with AJAX
        document.getElementById('eventForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            // Get the JWT token (assuming it's stored in localStorage)
            const token = localStorage.getItem('auth_token');

            fetch('event.php', {
                method: 'POST',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    alert('Event created successfully!');
                    console.log(result); // Handle success (you can redirect or update UI)
                } else {
                    alert('Error: ' + result.message); // Handle error
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Something went wrong!');
            });
        });
    </script>
</body>

</html>

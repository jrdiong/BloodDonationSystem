<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Events</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* ===== Event Card ===== */
.event-card {
    display: flex;
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin: 15px auto;
    width: 80%;
    cursor: pointer;
    position: relative;
}

.event-image {
    width: 150px;
    height: 120px;
    border-radius: 12px;
    background: #eee;
    overflow: hidden;
    flex-shrink: 0;
}

.event-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.event-info {
    margin-left: 20px;
}

.event-info h3 {
    margin: 0;
    font-size: 22px;
}

.event-info p {
    margin: 6px 0;
}

/* ===== Admin Delete ===== */
.delete-btn {
    position: absolute;
    right: 20px;
    top: 20px;
    font-size: 22px;
    color: red;
    cursor: pointer;
}

/* ===== Modal ===== */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
}

.modal-content {
    background: #fff;
    width: 600px;
    margin: 60px auto;
    padding: 25px;
    border-radius: 15px;
}

.modal-content input,
.modal-content textarea,
.modal-content select {
    width: 100%;
    margin-bottom: 12px;
    padding: 8px;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

#createEventBtn {
    display: none;
    margin: 20px auto;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2 style="text-align:center;">Event List</h2>

<!-- Add New Event Button (Event Organizer Only) -->
<button id="createEventBtn">Add New Event</button>

<div id="eventList"></div>

<!-- ===== Event Modal ===== -->
<div class="modal" id="eventModal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>

    <div class="event-image" style="margin-bottom:15px;">
        <img id="previewImage" src="placeholder.jpg">
    </div>

    <input type="file" id="imageUpload">

    <input type="text" id="eventName" placeholder="Event Name" required>
    <input type="datetime-local" id="dateTime" required>
    <input type="number" id="maxDonors" placeholder="Max Donors" required>
    <textarea id="description" placeholder="Description" required></textarea>

    <!-- Hospital select (Event Organizer) -->
    <select id="hospitalSelect" style="display:none; margin-bottom:12px;"></select>

    <div class="modal-buttons" id="modalButtons"></div>
  </div>
</div>

<script>
let currentEventID = null;
let currentRole = null;
let canEdit = false;

/* ===== Load Event List ===== */
fetch('event.php')
.then(res => res.json())
.then(data => {
    if(data.status !== 'success') {
        alert(data.message || 'Failed to load events');
        return;
    }

    currentRole = data.role; 

    if(currentRole === 'Event Organizer') {
        document.getElementById('createEventBtn').style.display = 'block';
        fetch('event.php?action=getHospitals')
        .then(res => res.json())
        .then(hData => {
            if(hData.status === 'success'){
                const select = document.getElementById('hospitalSelect');
                select.innerHTML = '<option value="">Select Hospital</option>';
                hData.data.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h.userID;
                    opt.textContent = h.name;
                    select.appendChild(opt);
                });
            }
        });
    }

    data.data.forEach(event => {
        const card = document.createElement('div');
        card.className = 'event-card';

        const imgSrc = event.image_url ? event.image_url : 'placeholder.jpg';
        card.innerHTML = `
            <div class="event-image">
                <img src="${imgSrc}" onerror="this.src='placeholder.jpg'">
            </div>
            <div class="event-info">
                <h3>${event.eventName}</h3>
                <p>Time: ${event.dateTime}</p>
                <p>Max Donor: ${event.maxDonors}</p>
            </div>
        `;

        card.onclick = () => openEvent(event.eventID);

        if(currentRole === 'Admin'){
            const del = document.createElement('div');
            del.className = 'delete-btn';
            del.innerText = '-';
            del.onclick = (e) => {
                e.stopPropagation();
                deleteEvent(event.eventID);
            };
            card.appendChild(del);
        }

        document.getElementById('eventList').appendChild(card);
    });
})
.catch(err => {
    console.error(err);
    alert('Error loading events');
});

function closeModal(){ /* 保持原样 */ }
function bookEvent(){ /* 保持原样 */ }
function deleteEvent(id){ /* 保持原样 */ }
function saveEvent(){ /* 保持原样 */ }
document.getElementById('createEventBtn').onclick = ()=>{/* 保持原样 */}  
function sendRequest(){ /* 保持原样 */ }

/* ===== Image Preview (仅针对上传预览) ===== */
document.getElementById('imageUpload').addEventListener('change', function(){
    const file = this.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            document.getElementById('previewImage').src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
});
</script>

</body>
</html>

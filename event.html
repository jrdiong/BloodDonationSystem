<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 20px;
        }

        .header-info {
            background-color: #ffe6e6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .table-layout {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .table-cell {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
        }

        .create-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            width: 400px;
            border-radius: 8px;
        }

        .modal-content label {
            display: block;
            margin-bottom: 6px;
        }

        .modal-content input,
        .modal-content textarea,
        .modal-content select,
        .modal-content button {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header-info">
        <h2>Event List</h2>
        <p>Below is the list of events related to your account.</p>
    </div>

    <div class="table-layout" id="eventList"></div>

    <button id="createBtn" class="create-button" onclick="openCreateForm()">
        Create New Event
    </button>
</div>

<!-- Create Event Modal -->
<div class="modal" id="createEventModal">
    <div class="modal-content">
        <h3>Create New Event</h3>

        <form id="createEventForm" enctype="multipart/form-data">
            <label>Event Name</label>
            <input type="text" name="eventName" required>

            <label>Event Image</label>
            <input type="file" name="imageUpload" accept="image/*" required>

            <label>Location</label>
            <input type="text" name="location" required>

            <label>Date & Time</label>
            <input type="datetime-local" name="dateTime" required>

            <label>Max Donors</label>
            <input type="number" name="maxDonors" required>

            <label>Hospital</label>
            <select name="hospitalID" id="hospitalSelect" required>
                <option value="">Select Hospital</option>
            </select>

            <label>Description</label>
            <textarea name="description"></textarea>

            <button type="button" onclick="saveEvent()">Save</button>
            <button type="button" onclick="closeModal()">Cancel</button>
        </form>
    </div>
</div>

<script>
/* =========================
   Fetch Events
========================= */
function fetchEvents() {
    fetch('event.php')
        .then(res => res.json())
        .then(res => {
            if (res.status === 'success') {
                displayEvents(res.data);
            }
        });
}

/* =========================
   Display Events
========================= */
function displayEvents(events) {
    const container = document.getElementById('eventList');
    container.innerHTML = '';

    events.forEach(e => {
        container.innerHTML += `
            <div class="table-cell">${e.eventName}</div>
            <div class="table-cell">
                ${e.image_url ? `<img src="${e.image_url}" width="60">` : ''}
            </div>
            <div class="table-cell">${e.location}</div>
            <div class="table-cell">${e.dateTime}</div>
            <div class="table-cell">${e.maxDonors}</div>
        `;
    });
}

/* =========================
   Load Hospitals
========================= */
function loadHospitals() {
    fetch('event.php?action=getHospitals')
        .then(res => res.json())
        .then(res => {
            if (res.status !== 'success') return;

            const select = document.getElementById('hospitalSelect');
            select.innerHTML = '<option value="">Select Hospital</option>';

            res.data.forEach(h => {
                select.innerHTML += `
                    <option value="${h.userID}">${h.name}</option>
                `;
            });
        });
}

/* =========================
   Modal Control
========================= */
function openCreateForm() {
    document.getElementById('createEventModal').style.display = 'flex';
    loadHospitals();
}

function closeModal() {
    document.getElementById('createEventModal').style.display = 'none';
}

/* =========================
   Save Event
========================= */
function saveEvent() {
    const formData = new FormData(document.getElementById('createEventForm'));

    fetch('event.php', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(res => {
        if (res.status === 'success') {
            closeModal();
            fetchEvents();
            alert('Event created successfully');
        } else {
            alert(res.message || 'Failed to create event');
        }
    });
}

/* =========================
   Init
========================= */
fetchEvents();

/* Show create button only for Event Organizer */
fetch('event.php')
    .then(res => res.json())
    .then(res => {
        if (res.status === 'success') {
            document.getElementById('createBtn').style.display = 'inline-block';
        }
    });
</script>

</body>
</html>

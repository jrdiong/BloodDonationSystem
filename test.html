<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile Test</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
#avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px solid #ccc;
    cursor: pointer;
    object-fit: cover;
}
.profile-field { margin-bottom: 15px; }
.field-label { display: inline-block; width: 80px; font-weight: bold; }
.field-value { display: inline-block; min-width: 150px; }
.edit-icon { cursor: pointer; margin-left: 5px; color: #007BFF; }
.edit-input { padding: 3px; width: 200px; }
.save-btn, .cancel-btn { margin-left: 5px; padding: 2px 6px; font-size: 12px; }
#healthReportSection { margin-top: 20px; display: none; }
#medicalHistory { width: 100%; max-width: 400px; }
</style>
</head>
<body>

<h2>User Profile</h2>

<!-- Avatar -->
<img id="avatar" src="default-avatar.png" alt="Avatar">
<input type="file" id="avatarInput" style="display:none" accept="image/*">

<!-- Profile Fields -->
<div class="profile-field">
    <span class="field-label">Name:</span>
    <span class="field-value" id="nameValue"></span>
    <span class="edit-icon" data-field="name">&#9998;</span>
</div>

<div class="profile-field">
    <span class="field-label">Email:</span>
    <span class="field-value" id="emailValue"></span>
    <span class="edit-icon" data-field="email">&#9998;</span>
</div>

<div class="profile-field">
    <span class="field-label">Phone:</span>
    <span class="field-value" id="phoneNumberValue"></span>
    <span class="edit-icon" data-field="phoneNumber">&#9998;</span>
</div>

<div class="profile-field" id="hospitalField" style="display:none;">
    <span class="field-label">Location:</span>
    <span class="field-value" id="locationValue"></span>
    <span class="edit-icon" data-field="location">&#9998;</span>
</div>

<!-- Donor Health Report -->
<div id="healthReportSection">
    <h3>Upload Health Report</h3>
    <textarea id="medicalHistory" rows="6" placeholder="Describe your health..."></textarea>
    <button id="uploadHealthReport">Upload</button>
</div>

<script>
const avatarImg = document.getElementById('avatar');
const avatarInput = document.getElementById('avatarInput');

// Avatar upload
avatarImg.addEventListener('click', () => avatarInput.click());
avatarInput.addEventListener('change', () => {
    const file = avatarInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('avatar', file);

    fetch('upload_avatar.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                avatarImg.src = data.image_url + '?t=' + new Date().getTime();
                alert('Avatar updated successfully!');
            } else {
                alert('Upload failed: ' + data.error);
            }
        });
});

// Load profile
let profile = {};
function loadProfile() {
    fetch('profile.php')
        .then(res => res.json())
        .then(data => {
            if (!data.success) { alert(data.error); return; }
            profile = data.profile;

            document.getElementById('nameValue').textContent = profile.name;
            document.getElementById('emailValue').textContent = profile.email;
            document.getElementById('phoneNumberValue').textContent = profile.phoneNumber;
            if (profile.image_url) avatarImg.src = profile.image_url + '?t=' + new Date().getTime();

            if (profile.role === 'Hospital') {
                document.getElementById('hospitalField').style.display = 'block';
                document.getElementById('locationValue').textContent = profile.hospitalInfo?.location || '';
            }

            // Show Health Report section only for Donor
            if (profile.role === 'Donor') {
                document.getElementById('healthReportSection').style.display = 'block';
                document.getElementById('medicalHistory').value = profile.donorInfo?.medicalHistory || '';
            }
        });
}

// Helper functions for editing fields
function createInputField(field, currentValue) {
    const input = document.createElement('input');
    input.type = (field === 'email') ? 'email' : 'text';
    input.value = currentValue;
    input.className = 'edit-input';
    input.id = field + 'Input';
    return input;
}

function createButton(text, className) {
    const btn = document.createElement('button');
    btn.textContent = text;
    btn.className = className;
    return btn;
}

function createValueSpan(value, field) {
    const span = document.createElement('span');
    span.className = 'field-value';
    span.id = field + 'Value';
    span.textContent = value;
    return span;
}

function createEditIcon(field) {
    const icon = document.createElement('span');
    icon.className = 'edit-icon';
    icon.dataset.field = field;
    icon.innerHTML = '&#9998;';
    icon.addEventListener('click', () => startEdit(field));
    return icon;
}

// Start editing
function startEdit(field) {
    const valueSpan = document.getElementById(field + 'Value');
    const currentValue = valueSpan.textContent;
    const parentDiv = valueSpan.parentNode;
    const icon = parentDiv.querySelector('.edit-icon');

    const input = createInputField(field, currentValue);
    const saveBtn = createButton('Save', 'save-btn');
    const cancelBtn = createButton('Cancel', 'cancel-btn');

    valueSpan.replaceWith(input);
    icon.replaceWith(saveBtn);
    parentDiv.appendChild(cancelBtn);

    cancelBtn.addEventListener('click', () => {
        input.replaceWith(createValueSpan(currentValue, field));
        saveBtn.replaceWith(createEditIcon(field));
        cancelBtn.remove();
    });

    saveBtn.addEventListener('click', () => {
        const newValue = input.value.trim();
        if (!newValue) { alert('Field cannot be empty'); return; }
        if (field === 'email' && !/^\S+@\S+\.\S+$/.test(newValue)) {
            alert('Invalid email format'); return;
        }

        const formData = new FormData();
        formData.append(field, newValue);

        fetch('update_profile.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Field updated successfully!');
                    input.replaceWith(createValueSpan(newValue, field));
                    saveBtn.replaceWith(createEditIcon(field));
                    cancelBtn.remove();
                } else {
                    alert('Update failed: ' + data.error);
                }
            });
    });
}

// Upload Health Report
document.getElementById('uploadHealthReport').addEventListener('click', () => {
    const medicalHistory = document.getElementById('medicalHistory').value.trim();
    if (!medicalHistory) { alert('Health report cannot be empty'); return; }

    const formData = new FormData();
    formData.append('medicalHistory', medicalHistory);

    fetch('update_profile.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) alert('Health report uploaded successfully!');
            else alert('Upload failed: ' + data.error);
        });
});

// Initialize
loadProfile();
document.querySelectorAll('.edit-icon').forEach(icon => {
    icon.addEventListener('click', () => startEdit(icon.dataset.field));
});
</script>

</body>
</html>

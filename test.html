<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            object-fit: cover;
        }
        .profile-field {
            margin-bottom: 15px;
        }
        .field-label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        .field-value {
            display: inline-block;
            min-width: 150px;
        }
        .edit-icon {
            cursor: pointer;
            margin-left: 5px;
            color: #007BFF;
        }
        .edit-input {
            padding: 3px;
            width: 200px;
        }
        .save-btn, .cancel-btn {
            margin-left: 5px;
            padding: 2px 6px;
            font-size: 12px;
        }

        /* Modal for Health Form */
        #healthModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        #healthModalContent {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
            max-height: 90%;
            overflow-y: auto;
        }
        #healthModalContent h3 {
            margin-top: 0;
        }
        #healthModalContent label {
            display: block;
            margin-bottom: 8px;
        }
        #healthModalContent input,
        #healthModalContent select,
        #healthModalContent textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
        }
        #healthModalContent button {
            padding: 5px 10px;
            margin-right: 5px;
        }
    </style>
</head>
<body>

<h2>User Profile</h2>

<!-- Avatar -->
<img id="avatar" src="default-avatar.png" alt="Avatar">
<input type="file" id="avatarInput" style="display:none" accept="image/*">

<!-- User Profile Fields -->
<div class="profile-field">
    <span class="field-label">Name:</span>
    <span class="field-value" id="nameValue"></span>
    <span class="edit-icon" data-field="name">&#9998;</span>
</div>
<div class="profile-field">
    <span class="field-label">Email:</span>
    <span class="field-value" id="emailValue"></span>
    <span class="edit-icon" data-field="email">&#9998;</span>
</div>
<div class="profile-field">
    <span class="field-label">Phone:</span>
    <span class="field-value" id="phoneNumberValue"></span>
    <span class="edit-icon" data-field="phoneNumber">&#9998;</span>
</div>
<div class="profile-field" id="hospitalField" style="display:none;">
    <span class="field-label">Location:</span>
    <span class="field-value" id="locationValue"></span>
    <span class="edit-icon" data-field="location">&#9998;</span>
</div>

<!-- Donor Health Report Section -->
<div id="healthRptSection" style="display:none; margin-top:20px;">
    <h3>Health Report</h3>
    <button id="editHealthBtn">Edit Health Report</button>
</div>

<!-- Modal for Editing Health Report -->
<div id="healthModal">
    <div id="healthModalContent">
        <h3>Edit Health Report</h3>
        <form id="healthForm">
            <label>Blood Type:
                <select name="bloodType" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="AB">AB</option>
                    <option value="O">O</option>
                </select>
            </label>
            <label>Age: <input type="number" name="age" required></label>
            <label>Last Donate Date: <input type="date" name="dateLastDonate" required></label>
            <label>Medical History: <textarea name="medicalHistory" required></textarea></label>
            <label>Weight (kg): <input type="number" step="0.01" name="weight" required></label>
            <label>Height (cm): <input type="number" step="0.01" name="height" required></label>
            <button type="submit">Save</button>
            <button type="button" id="cancelHealthBtn">Cancel</button>
        </form>
    </div>
</div>

<script>
// ---------------- Avatar ----------------
const avatarImg = document.getElementById('avatar');
const avatarInput = document.getElementById('avatarInput');

// Avatar image click triggers file input click
avatarImg.addEventListener('click', () => avatarInput.click());

// Handle file input change event to upload avatar
avatarInput.addEventListener('change', () => {
    const file = avatarInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('avatar', file);

    fetch('upload_avatar.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                avatarImg.src = data.image_url + '?t=' + new Date().getTime();  // Cache busting
            } else {
                alert('Upload failed: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error uploading avatar:', error);
            alert('Upload failed: ' + error.message);
        });
});

// ---------------- Load Profile ----------------
function loadProfile() {
    fetch('profile.php')
        .then(res => res.json())
        .then(data => {
            if (!data.success) {
                alert(data.error);
                return;
            }
            const profile = data.profile;
            document.getElementById('nameValue').textContent = profile.name;
            document.getElementById('emailValue').textContent = profile.email;
            document.getElementById('phoneNumberValue').textContent = profile.phoneNumber;
            if (profile.image_url) avatarImg.src = profile.image_url + '?t=' + new Date().getTime();

            if (profile.role === 'Hospital') {
                document.getElementById('hospitalField').style.display = 'block';
                document.getElementById('locationValue').textContent = profile.hospitalInfo?.location || '';
            }

            if (profile.role === 'Donor') {
                document.getElementById('healthRptSection').style.display = 'block';
                const form = document.getElementById('healthForm');
                form.bloodType.value = profile.donorInfo?.bloodType || '';
                form.age.value = profile.donorInfo?.age || '';
                form.dateLastDonate.value = profile.donorInfo?.dateLastDonate || '';
                form.medicalHistory.value = profile.donorInfo?.medicalHistory || '';
                form.weight.value = profile.donorInfo?.weight || '';
                form.height.value = profile.donorInfo?.height || '';
            }

            bindEditIcons();
        });
}

// ---------------- Edit Fields ----------------
function bindEditIcons() {
    document.querySelectorAll('.edit-icon').forEach(icon => {
        if (!icon.dataset.bound) {
            icon.addEventListener('click', () => startEdit(icon.dataset.field));
            icon.dataset.bound = 'true';
        }
    });
}

// Create input field for editing
function createInputField(field, currentValue) {
    const input = document.createElement('input');
    input.type = (field === 'email') ? 'email' : 'text';
    input.value = currentValue;
    input.className = 'edit-input';
    return input;
}

// Create button for saving or cancelling
function createButton(text, className) {
    const btn = document.createElement('button');
    btn.textContent = text;
    btn.className = className;
    return btn;
}

// Create value span element
function createValueSpan(value, field) {
    const span = document.createElement('span');
    span.className = 'field-value';
    span.id = field + 'Value';
    span.textContent = value;
    return span;
}

// Start editing the field
function startEdit(field) {
    const valueSpan = document.getElementById(field + 'Value');
    const currentValue = valueSpan.textContent;
    const parentDiv = valueSpan.parentNode;
    const icon = parentDiv.querySelector('.edit-icon');

    const input = createInputField(field, currentValue);
    const saveBtn = createButton('Save', 'save-btn');
    const cancelBtn = createButton('Cancel', 'cancel-btn');

    valueSpan.replaceWith(input);
    icon.replaceWith(saveBtn);
    parentDiv.appendChild(cancelBtn);

    cancelBtn.addEventListener('click', () => {
        input.replaceWith(createValueSpan(currentValue, field));
        saveBtn.replaceWith(createEditIcon(field));
        cancelBtn.remove();
    });

    saveBtn.addEventListener('click', () => {
        const newValue = input.value.trim();
        if (!newValue) { alert('Field cannot be empty'); return; }
        if (field === 'email' && !/^\S+@\S+\.\S+$/.test(newValue)) {
            alert('Invalid email format'); return;
        }

        const formData = new FormData();
        formData.append(field, newValue);
        formData.append('userID', 1); // TEMP

        fetch('update_profile.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    input.replaceWith(createValueSpan(newValue, field));
                    saveBtn.replaceWith(createEditIcon(field));
                    cancelBtn.remove();
                } else alert('Update failed: ' + data.error);
            });
    });
}

// ---------------- Donor Health Modal ----------------
const editHealthBtn = document.getElementById('editHealthBtn');
const healthModal = document.getElementById('healthModal');
const healthForm = document.getElementById('healthForm');
const cancelHealthBtn = document.getElementById('cancelHealthBtn');

editHealthBtn.addEventListener('click', () => healthModal.style.display = 'flex');
cancelHealthBtn.addEventListener('click', () => healthModal.style.display = 'none');

healthForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(healthForm);
    formData.append('userID', 1); // TEMP

    fetch('update_health_report.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Health report updated successfully!');
                healthModal.style.display = 'none';
                loadProfile();
            } else alert('Update failed: ' + data.error);
        });
});

// ---------------- Initialize ----------------
window.addEventListener('DOMContentLoaded', () => loadProfile());
</script>

</body>
</html>

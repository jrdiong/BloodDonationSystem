<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile Test</title>
<style>
    #avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid #ccc;
        cursor: pointer;
        object-fit: cover;
    }
    .profile-info {
        margin-top: 10px;
    }
</style>
</head>
<body>

<h2>User Profile Test</h2>

<!-- Avatar -->
<img id="avatar" src="default-avatar.png" alt="Avatar">
<input type="file" id="avatarInput" style="display:none" accept="image/*">

<!-- User Info -->
<div class="profile-info">
    <p><strong>Name:</strong> <span id="name"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>
</div>

<script>
const avatarImg = document.getElementById('avatar');
const avatarInput = document.getElementById('avatarInput');

// 点击头像触发选择文件
avatarImg.addEventListener('click', () => avatarInput.click());

// 上传头像
avatarInput.addEventListener('change', () => {
    const file = avatarInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('avatar', file);

    fetch('upload_avatar.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                avatarImg.src = data.image_url + '?t=' + new Date().getTime();
                alert('Avatar updated successfully!');
            } else {
                alert('Upload failed: ' + data.error);
            }
        })
        .catch(err => alert('Upload error: ' + err));
});

// Load profile info
function loadProfile() {
    fetch('profile.php')
        .then(res => res.json())
        .then(data => {
            if (!data.success) {
                alert(data.error);
                return;
            }
            const profile = data.profile;
            document.getElementById('name').textContent = profile.name;
            document.getElementById('email').textContent = profile.email;
            document.getElementById('phone').textContent = profile.phoneNumber;
            if (profile.image_url) {
                avatarImg.src = profile.image_url + '?t=' + new Date().getTime();
            }
        });
}

// 初始化
loadProfile();
</script>

</body>
</html>

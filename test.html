<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile Test</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
#avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px solid #ccc;
    cursor: pointer;
    object-fit: cover;
}
.profile-field { margin-bottom: 15px; }
.field-label { display: inline-block; width: 80px; font-weight: bold; }
.field-value { display: inline-block; min-width: 150px; }
.edit-icon { cursor: pointer; margin-left: 5px; color: #007BFF; }
.edit-input { padding: 3px; width: 200px; }
.save-btn, .cancel-btn { margin-left: 5px; padding: 2px 6px; font-size: 12px; }

/* Health Report Modal */
#healthReportModal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border: 1px solid #ccc;
    padding: 20px;
    z-index: 1000;
    width: 350px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
#modalOverlay {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    z-index: 900;
}
.modal-field { margin-bottom: 10px; }
.modal-field label { display: block; margin-bottom: 3px; font-weight: bold; }
.modal-field input, .modal-field select, .modal-field textarea { width: 100%; padding: 5px; box-sizing: border-box; }
.modal-buttons { text-align: right; }
.modal-buttons button { margin-left: 5px; }
</style>
</head>
<body>

<h2>User Profile</h2>

<!-- Avatar -->
<img id="avatar" src="default-avatar.png" alt="Avatar">
<input type="file" id="avatarInput" style="display:none" accept="image/*">

<!-- Profile Fields -->
<div class="profile-field">
    <span class="field-label">Name:</span>
    <span class="field-value" id="nameValue"></span>
    <span class="edit-icon" data-field="name">&#9998;</span>
</div>
<div class="profile-field">
    <span class="field-label">Email:</span>
    <span class="field-value" id="emailValue"></span>
    <span class="edit-icon" data-field="email">&#9998;</span>
</div>
<div class="profile-field">
    <span class="field-label">Phone:</span>
    <span class="field-value" id="phoneNumberValue"></span>
    <span class="edit-icon" data-field="phoneNumber">&#9998;</span>
</div>
<div class="profile-field" id="hospitalField" style="display:none;">
    <span class="field-label">Location:</span>
    <span class="field-value" id="locationValue"></span>
    <span class="edit-icon" data-field="location">&#9998;</span>
</div>

<!-- Health Report Button (only for Donor) -->
<div id="healthReportBtnContainer" style="margin-top:20px; display:none;">
    <button id="healthReportBtn">Update Health Report</button>
</div>

<!-- Modal Overlay -->
<div id="modalOverlay"></div>

<!-- Health Report Modal -->
<div id="healthReportModal">
    <h3>Health Report</h3>
    <div class="modal-field">
        <label for="hrBloodType">Blood Type</label>
        <select id="hrBloodType">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
        </select>
    </div>
    <div class="modal-field">
        <label for="hrAge">Age</label>
        <input type="number" id="hrAge" min="0">
    </div>
    <div class="modal-field">
        <label for="hrDateLastDonate">Last Donation Date</label>
        <input type="date" id="hrDateLastDonate">
    </div>
    <div class="modal-field">
        <label for="hrMedicalHistory">Medical History</label>
        <textarea id="hrMedicalHistory" rows="3"></textarea>
    </div>
    <div class="modal-field">
        <label for="hrWeight">Weight (kg)</label>
        <input type="number" step="0.1" id="hrWeight">
    </div>
    <div class="modal-field">
        <label for="hrHeight">Height (cm)</label>
        <input type="number" step="0.1" id="hrHeight">
    </div>
    <div class="modal-buttons">
        <button id="cancelHR">Cancel</button>
        <button id="saveHR">Save</button>
    </div>
</div>

<script>
const avatarImg = document.getElementById('avatar');
const avatarInput = document.getElementById('avatarInput');
avatarImg.addEventListener('click', () => avatarInput.click());
avatarInput.addEventListener('change', () => {
    const file = avatarInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('avatar', file);
    fetch('upload_avatar.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                avatarImg.src = data.image_url + '?t=' + new Date().getTime();
                alert('Avatar updated successfully!');
            } else alert('Upload failed: ' + data.error);
        });
});

// Load profile
let profileData = {};
function loadProfile() {
    fetch('profile.php')
        .then(res => res.json())
        .then(data => {
            if (!data.success) { alert(data.error); return; }
            const profile = data.profile;
            profileData = profile;
            document.getElementById('nameValue').textContent = profile.name;
            document.getElementById('emailValue').textContent = profile.email;
            document.getElementById('phoneNumberValue').textContent = profile.phoneNumber;
            if (profile.image_url) avatarImg.src = profile.image_url + '?t=' + new Date().getTime();

            if (profile.role === 'Hospital') {
                document.getElementById('hospitalField').style.display = 'block';
                document.getElementById('locationValue').textContent = profile.hospitalInfo?.location || '';
            }

            // Show health report button only for Donor
            if (profile.role === 'Donor') {
                document.getElementById('healthReportBtnContainer').style.display = 'block';
            }
        });
}

// -----------------------
// Health Report Modal Logic
const healthBtn = document.getElementById('healthReportBtn');
const modal = document.getElementById('healthReportModal');
const overlay = document.getElementById('modalOverlay');
const cancelHR = document.getElementById('cancelHR');
const saveHR = document.getElementById('saveHR');

healthBtn.addEventListener('click', () => {
    // Pre-fill current donor info
    const donor = profileData.donorInfo || {};
    document.getElementById('hrBloodType').value = donor.bloodType || profileData.bloodType || 'A';
    document.getElementById('hrAge').value = donor.age || profileData.age || '';
    document.getElementById('hrDateLastDonate').value = donor.dateLastDonate || '';
    document.getElementById('hrMedicalHistory').value = donor.medicalHistory || '';
    document.getElementById('hrWeight').value = donor.weight || '';
    document.getElementById('hrHeight').value = donor.height || '';

    modal.style.display = 'block';
    overlay.style.display = 'block';
});

cancelHR.addEventListener('click', () => {
    modal.style.display = 'none';
    overlay.style.display = 'none';
});

saveHR.addEventListener('click', () => {
    const data = {
        bloodType: document.getElementById('hrBloodType').value,
        age: document.getElementById('hrAge').value,
        dateLastDonate: document.getElementById('hrDateLastDonate').value,
        medicalHistory: document.getElementById('hrMedicalHistory').value,
        weight: document.getElementById('hrWeight').value,
        height: document.getElementById('hrHeight').value
    };

    // Simple validation
    for (let key in data) {
        if (data[key] === '') { alert(key + ' cannot be empty'); return; }
    }

    const formData = new FormData();
    for (let key in data) formData.append(key, data[key]);

    fetch('update_health_report.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(resp => {
            if (resp.success) {
                alert('Health report updated successfully!');
                modal.style.display = 'none';
                overlay.style.display = 'none';
                loadProfile(); // reload profile to reflect changes
            } else {
                alert('Update failed: ' + resp.error);
            }
        });
});

// -----------------------
// Existing profile edit logic can remain
// (not repeated here for brevity)

loadProfile();
</script>

</body>
</html>

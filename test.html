<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blood Inventory Test</title>
<style>
/* Inventory boxes */
.blood-box {
    display:inline-block;
    width:180px;
    height:120px;
    border:1px solid #333;
    margin:10px;
    padding:10px;
    cursor:pointer;
    text-align:left;
    background:#f8f8f8;
}

/* Edit form modal */
#editForm {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    padding:20px;
    border:2px solid #333;
    z-index:1000;
}

#overlay {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
    z-index:900;
}

label {
    display:inline-block;
    width:100px;
}
</style>
</head>
<body>

<h2>Blood Inventory</h2>
<div id="inventoryContainer"></div>

<!-- Overlay for modal -->
<div id="overlay" onclick="closeForm()"></div>

<!-- Edit Form Modal -->
<div id="editForm">
    <h3 id="formTitle">Edit Blood Inventory</h3>
    <label>Available (+/-):</label> <input type="number" id="available" value="0"><br><br>
    <label>Used (+ only):</label> <input type="number" id="used" value="0" min="0"><br><br>
    <label>Delivered (+/-):</label> <input type="number" id="delivered" value="0"><br><br>
    <button onclick="submitEdit()">Submit</button>
    <button onclick="closeForm()">Cancel</button>
</div>

<script>
let currentBloodType = "";
let inventoryData = {}; // store latest inventory

// Fetch inventory from bloodinventory.php
function fetchInventory(){
    fetch("bloodinventory.php")
        .then(res=>res.json())
        .then(data=>{
            inventoryData = data; // store latest
            const container = document.getElementById("inventoryContainer");
            container.innerHTML="";
            for(const type in data){
                let box = document.createElement("div");
                box.className="blood-box";
                box.innerHTML = `<strong>${type}</strong><br>
                                 Available: ${data[type].available}<br>
                                 Expired: ${data[type].expired}<br>
                                 Used: ${data[type].used}<br>
                                 Delivered: ${data[type].delivered}`;
                box.onclick = ()=>openForm(type);
                container.appendChild(box);
            }
        });
}

// Open edit form modal
function openForm(bloodType){
    currentBloodType = bloodType;
    document.getElementById("formTitle").innerText = `Edit ${bloodType} Inventory`;
    document.getElementById("available").value=0;
    document.getElementById("used").value=0;
    document.getElementById("delivered").value=0;
    document.getElementById("overlay").style.display="block";
    document.getElementById("editForm").style.display="block";
}

// Close edit form modal
function closeForm(){
    document.getElementById("editForm").style.display="none";
    document.getElementById("overlay").style.display="none";
}

// Submit edit form via AJAX
function submitEdit(){
    const availableVal = parseInt(document.getElementById("available").value) || 0;
    const usedVal = parseInt(document.getElementById("used").value) || 0;
    const deliveredVal = parseInt(document.getElementById("delivered").value) || 0;

    const currentAvailable = inventoryData[currentBloodType].available;

    // Check if Used + Delivered exceeds Available
    let totalDecrease = usedVal>0 ? usedVal : 0;
    totalDecrease += deliveredVal>0 ? deliveredVal : 0;

    if(totalDecrease > currentAvailable){
        alert("Error: Cannot increase Used or Delivered more than Available!");
        return; // prevent submit
    }

    // Prepare form data
    const data = new FormData();
    data.append("bloodType", currentBloodType);
    data.append("addAvailable", availableVal>0?availableVal:0);
    data.append("removeAvailable", availableVal<0?-availableVal:0);
    data.append("addUsed", usedVal>0?usedVal:0);
    data.append("addDelivered", deliveredVal>0?deliveredVal:0);
    data.append("removeDelivered", deliveredVal<0?-deliveredVal:0);

    // Submit via AJAX
    fetch("edit_inventory.php", {method:"POST", body:data})
        .then(res=>res.json())
        .then(resp=>{
            if(resp.success){
                alert("Inventory updated!");
                closeForm();
                fetchInventory();
            } else {
                alert("Error: "+resp.error);
            }
        });
}

// Initial load
fetchInventory();
</script>

</body>
</html>

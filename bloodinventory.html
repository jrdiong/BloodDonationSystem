<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blood Inventory Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .blood-type-box {
            border: 1px solid #333;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            width: 200px;
            vertical-align: top;
        }
        .status {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Blood Inventory Summary (Test)</h1>
    <div id="inventory-container"></div>

    <script>
        // Function to fetch inventory data
        async function fetchInventory() {
            try {
                const response = await fetch('bloodinventory.php'); 
                const data = await response.json();

                const container = document.getElementById('inventory-container');
                container.innerHTML = ''; 
                for (const bloodType in data) {
                    const box = document.createElement('div');
                    box.className = 'blood-type-box';

                    const title = document.createElement('h2');
                    title.textContent = 'Blood Type: ' + bloodType;
                    box.appendChild(title);

                    for (const status in data[bloodType]) {
                        const statusDiv = document.createElement('div');
                        statusDiv.className = 'status';
                        statusDiv.textContent = status.charAt(0).toUpperCase() + status.slice(1) + ': ' + data[bloodType][status];
                        box.appendChild(statusDiv);
                    }

                    container.appendChild(box);
                }

            } catch (error) {
                console.error('Error fetching inventory:', error);
                document.getElementById('inventory-container').textContent = 'Failed to load inventory.';
            }
        }

        // Initial fetch
        fetchInventory();

        // Optional: auto-refresh every 10 seconds
        setInterval(fetchInventory, 10000);
    </script>
</body>
</html>

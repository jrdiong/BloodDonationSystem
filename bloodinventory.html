<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Inventory</title>
  <style>
    /* ====== 基础样式（你可以换成自己的） ====== */
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      color: red;
    }

    .blood-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .blood-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: 0.2s;
    }

    .blood-card:hover {
      background: #ffe5e5;
    }

    .blood-type {
      font-size: 24px;
      font-weight: bold;
      width: 60px;
    }

    .blood-info p {
      margin: 4px 0;
    }

    /* ====== Modal ====== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
    }

    .modal-content {
      background: #fff;
      width: 350px;
      margin: 120px auto;
      padding: 20px;
      border-radius: 10px;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .modal-content label {
      display: block;
      margin-top: 10px;
    }

    .modal-content input {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
    }

    .modal-actions {
      margin-top: 15px;
      text-align: right;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-save {
      background: green;
      color: #fff;
    }

    .btn-cancel {
      background: red;
      color: #fff;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Blood Inventory</h1>

  <!-- ====== Blood Cards ====== -->
  <div class="blood-grid">

    <div class="blood-card" data-blood="A">
      <div class="blood-type">A</div>
      <div class="blood-info">
        <p>Available: <span class="available">0</span></p>
        <p>Expired: <span class="expired">0</span></p>
        <p>Delivered: <span class="delivered">0</span></p>
      </div>
    </div>

    <div class="blood-card" data-blood="B">
      <div class="blood-type">B</div>
      <div class="blood-info">
        <p>Available: <span class="available">0</span></p>
        <p>Expired: <span class="expired">0</span></p>
        <p>Delivered: <span class="delivered">0</span></p>
      </div>
    </div>

    <div class="blood-card" data-blood="AB">
      <div class="blood-type">AB</div>
      <div class="blood-info">
        <p>Available: <span class="available">0</span></p>
        <p>Expired: <span class="expired">0</span></p>
        <p>Delivered: <span class="delivered">0</span></p>
      </div>
    </div>

    <div class="blood-card" data-blood="O">
      <div class="blood-type">O</div>
      <div class="blood-info">
        <p>Available: <span class="available">0</span></p>
        <p>Expired: <span class="expired">0</span></p>
        <p>Delivered: <span class="delivered">0</span></p>
      </div>
    </div>

  </div>
</div>

<!-- ====== Edit Modal ====== -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h2>Edit Blood Inventory</h2>

    <form id="editForm">
      <input type="hidden" name="blood_type" id="editBloodType">

      <label>Available</label>
      <input type="number" name="available" id="editAvailable">

      <label>Expired</label>
      <input type="number" name="expired" id="editExpired">

      <label>Delivered</label>
      <input type="number" name="delivered" id="editDelivered">
    </form>

    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" onclick="saveInventory()">Save</button>
    </div>
  </div>
</div>

<script>
/* ====== Load Summary ====== */
document.addEventListener("DOMContentLoaded", () => {
  fetch("bloodinventory.php")
    .then(res => res.json())
    .then(data => {
      data.forEach(item => {
        const card = document.querySelector(
          `.blood-card[data-blood="${item.blood_type}"]`
        );
        if (card) {
          card.querySelector(".available").textContent = item.available;
          card.querySelector(".expired").textContent = item.expired;
          card.querySelector(".delivered").textContent = item.delivered;
        }
      });
    });
});

/* ====== Click Card ====== */
document.querySelectorAll(".blood-card").forEach(card => {
  card.addEventListener("click", () => {
    document.getElementById("editBloodType").value = card.dataset.blood;
    document.getElementById("editAvailable").value =
      card.querySelector(".available").textContent;
    document.getElementById("editExpired").value =
      card.querySelector(".expired").textContent;
    document.getElementById("editDelivered").value =
      card.querySelector(".delivered").textContent;

    document.getElementById("editModal").style.display = "block";
  });
});

/* ====== Modal ====== */
function closeModal() {
  document.getElementById("editModal").style.display = "none";
}

function saveInventory() {
  const formData = new FormData(document.getElementById("editForm"));

  fetch("update_inventory.php", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(() => {
    closeModal();
    location.reload();
  });
}
</script>

</body>
</html>

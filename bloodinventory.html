<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blood Inventory API Test</title>
<style>
  body { font-family: Arial; padding: 20px; }
  label, select, button { font-size: 16px; margin: 5px 0; }
  pre { background: #f4f4f4; padding: 10px; border: 1px solid #ddd; max-height: 300px; overflow: auto; }
</style>
</head>
<body>

<h2>Blood Inventory API Test</h2>

<label for="bloodType">Select Blood Type:</label>
<select id="bloodType">
  <option value="A">A</option>
  <option value="B">B</option>
  <option value="AB">AB</option>
  <option value="O">O</option>
</select>

<div style="margin-top:15px;">
  <button id="btnGetInventory">Get Inventory Summary</button>
  <button id="btnGetBatches">Get Batches</button>
  <button id="btnEditInventory">Test Edit Inventory (Add 1 Available Unit)</button>
</div>

<h3>API Response:</h3>
<pre id="responseArea">No data yet.</pre>

<script>
const bloodTypeSelect = document.getElementById('bloodType');
const responseArea = document.getElementById('responseArea');

document.getElementById('btnGetInventory').addEventListener('click', () => {
  fetch('bloodinventory.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ action: 'get_summary' })
  })
  .then(res => res.json())
  .then(data => {
    responseArea.textContent = JSON.stringify(data, null, 2);
  })
  .catch(e => responseArea.textContent = 'Error: ' + e.message);
});

document.getElementById('btnGetBatches').addEventListener('click', () => {
  const bt = bloodTypeSelect.value;
  fetch('get_batches.php?bloodType=' + encodeURIComponent(bt))
  .then(res => res.json())
  .then(data => {
    responseArea.textContent = JSON.stringify(data, null, 2);
  })
  .catch(e => responseArea.textContent = 'Error: ' + e.message);
});

document.getElementById('btnEditInventory').addEventListener('click', () => {
  const bt = bloodTypeSelect.value;
  // 测试往available增加1单位，具体根据你接口设计调整
  fetch('edit_bloodinventory.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      bloodType: bt,
      action: 'add_available',
      units: 1
    })
  })
  .then(res => res.json())
  .then(data => {
    responseArea.textContent = JSON.stringify(data, null, 2);
  })
  .catch(e => responseArea.textContent = 'Error: ' + e.message);
});
</script>

</body>
</html>

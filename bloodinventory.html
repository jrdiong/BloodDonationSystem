<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Blood Inventory</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }

        /* 左侧导航 */
        .sidebar {
            width: 60px;
            background-color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        .sidebar button {
            width: 40px;
            height: 40px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #777;
            cursor: pointer;
        }

        .sidebar button.active {
            background-color: red;
        }

        /* 主内容 */
        .main-content {
            flex: 1;
            padding: 20px;
        }

        h1 {
            color: red;
            display: inline-block;
        }

        .inventory-list {
            margin-top: 20px;
        }

        .inventory-card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        .inventory-card:hover {
            background: #fdd;
        }

        .inventory-card img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .inventory-info {
            flex: 1;
        }

        .inventory-info p {
            margin: 2px 0;
        }

        /* 右侧编辑面板 */
        .edit-panel {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            width: 250px;
        }

        .edit-panel input {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
        }

        .edit-panel button {
            padding: 5px 10px;
            margin-right: 5px;
            cursor: pointer;
        }

        .edit-panel .btn-update {
            background-color: green;
            color: white;
            border: none;
        }

        .edit-panel .btn-delete {
            background-color: red;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button></button>
        <button></button>
        <button></button>
        <button></button>
        <button class="active"></button>
        <button></button>
    </div>

    <div class="main-content">
        <h1>Blood Inventory</h1>

        <div class="inventory-list">
            <!-- Example Blood Type Card -->
            <div class="inventory-card">
                <img src="bag_icon.png" alt="Blood Bag">
                <div class="inventory-info">
                    <strong>A+</strong>
                    <p>Quantity: 10</p>
                    <p>Last Updated: 2026-01-30</p>
                </div>
            </div>

            <div class="inventory-card">
                <img src="bag_icon.png" alt="Blood Bag">
                <div class="inventory-info">
                    <strong>B+</strong>
                    <p>Quantity: 8</p>
                    <p>Last Updated: 2026-01-28</p>
                </div>
            </div>

            <div class="inventory-card">
                <img src="bag_icon.png" alt="Blood Bag">
                <div class="inventory-info">
                    <strong>AB+</strong>
                    <p>Quantity: 5</p>
                    <p>Last Updated: 2026-01-27</p>
                </div>
            </div>

            <div class="inventory-card">
                <img src="bag_icon.png" alt="Blood Bag">
                <div class="inventory-info">
                    <strong>O+</strong>
                    <p>Quantity: 12</p>
                    <p>Last Updated: 2026-01-29</p>
                </div>
            </div>
        </div>

        <!-- Right-side edit panel -->
        <div class="edit-panel">
            <h3>Edit Blood Inventory</h3>
            <label>Blood Type</label>
            <input type="text" value="A+" readonly>
            <label>Quantity</label>
            <input type="number" value="10">
            <button class="btn-update">Update</button>
            <button class="btn-delete">Delete</button>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blood Inventory</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

/* Layout */
.container {
    display: flex;
    height: 100%;
}

/* Sidebar */
.sidebar {
    width: 70px;
    background: #666;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}

.sidebar div {
    width: 40px;
    height: 40px;
    background: #888;
    border-radius: 6px;
    margin-bottom: 15px;
}

.sidebar .active {
    background: red;
}

/* Main content */
.main {
    flex: 1;
    padding: 30px;
}

.main h1 {
    color: red;
}

/* Inventory list */
.inventory-card {
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    cursor: pointer;
}

.inventory-card:hover {
    background: #fdeaea;
}

/* Modal (hidden by default) */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
}

.modal-content {
    background: white;
    width: 300px;
    padding: 20px;
    border-radius: 10px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.modal-content input {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
}

.modal-content button {
    padding: 6px 10px;
}
</style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <div></div>
        <div></div>
        <div></div>
        <div class="active"></div>
        <div></div>
    </div>

    <!-- Main -->
    <div class="main">
        <h1>Blood Inventory</h1>

        <div class="inventory-card" onclick="openModal('A+')">
            <strong>A+</strong><br>
            Quantity: 10
        </div>

        <div class="inventory-card" onclick="openModal('B+')">
            <strong>B+</strong><br>
            Quantity: 8
        </div>

        <div class="inventory-card" onclick="openModal('AB+')">
            <strong>AB+</strong><br>
            Quantity: 5
        </div>

        <div class="inventory-card" onclick="openModal('O+')">
            <strong>O+</strong><br>
            Quantity: 12
        </div>
    </div>

</div>

<!-- Modal -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h3>Edit Blood Inventory</h3>
        <label>Blood Type</label>
        <input type="text" id="bloodType" readonly>

        <label>Quantity</label>
        <input type="number">

        <button onclick="closeModal()">Cancel</button>
        <button>Save</button>
    </div>
</div>

<script>
function openModal(type) {
    document.getElementById("bloodType").value = type;
    document.getElementById("editModal").style.display = "block";
}

function closeModal() {
    document.getElementById("editModal").style.display = "none";
}
</script>

</body>
</html>
